<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P+ ID Bookmarklet</title>
    <style>
        a {
          display: block;      /* Required to apply width and height */
          width: 100vw;        /* 100% of the viewport width */
          height: 100vh;       /* 100% of the viewport height */
          position: fixed;     /* Keeps it over all other content */
          top: 0;
          left: 0;
          z-index: 9999;       /* Ensures it stays on top */
          text-decoration: none; /* Optional: removes default underline */
        }

        html,
        body {
          margin: 0;
          width: 100%;
          height: 100%;
        }
        
        .fullscreen-button {
          display: flex;
          align-items: center;
          justify-content: center;
        
          width: 100vw;
          height: 100vh;
        
          background-color: #007bff;
          color: white;
        
          font-size: 2rem;
          font-family: sans-serif;
          text-decoration: none;
        
          border-radius: 24px;
        
          box-sizing: border-box;
          padding: 20px;
        
          transition: background-color 0.2s ease;
        }
        
        .fullscreen-button:hover {
          background-color: #005fcc;
        }
    </style>
</head>
<body>
    <a class='fullscreen-button' href="javascript:(function(){alert(`${CBS.Registry.user.id},${CBS.Registry.user.profile_id}`)})();">P+ ID Bookmarklet</a>
</body>
</html>
